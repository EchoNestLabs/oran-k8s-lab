{{- /* UEs: OAI nr-UE StatefulSet, one replica per UE; ordinal 0..N-1 selects
     the IMSI/config via the ue index. Init-waits for the gNB on rfsim 4043.
     Each pod needs NET_ADMIN + /dev/net/tun for its oaitun data interface.
     Values toggle: ran.enabled. */}}
{{- if .Values.ran.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-ue
  labels: {{- include "oran-lab.labels" (dict "ctx" . "component" "ue") | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-ue
  replicas: {{ .Values.ue.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "oran-lab.selectorLabels" (dict "ctx" . "component" "ue") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "oran-lab.labels" (dict "ctx" . "component" "ue") | nindent 8 }}
    spec:
      # No tcpSocket probe on the UE either (its rfsim CLIENT port matters less,
      # but stay consistent: exec/log gates only).
      initContainers:
        {{- include "oran-lab.waitfor" (dict
              "ctx" .
              "waitName" "wait-gnb"
              "waitHost" (printf "%s-gnb" .Release.Name)
              "waitPort" "4043") | nindent 8 }}
      containers:
        - name: ue
          image: "{{ .Values.images.ue.repository }}:{{ .Values.images.ue.tag }}"
          imagePullPolicy: Never
          securityContext:
            capabilities: { add: ["NET_ADMIN"] }
          volumeMounts:
            - { name: net-tun, mountPath: /dev/net/tun }
            - { name: ue-config, mountPath: /config }
          command: ["/bin/sh","-c"]
          args:
            - |
              ORD=${HOSTNAME##*-}
              # OAI-fork rfsim UE: rfsim params ride the
              # conf only (CLI rfsimulator.serveraddr is unknown there), and
              # carrier params (r/numerology/band/E) come from conf too.
              # Mirrors the proven native launch start_ue_rfsim_b*.sh.
              sed -e "s/__GNB_ADDR__/{{ .Release.Name }}-gnb/" \
                /config/ue${ORD}.conf > /tmp/ue.conf
              exec /src/cmake_targets/ran_build/build/nr-uesoftmodem \
                -O /tmp/ue.conf -C 3489420000 --rfsim --log_config.NAS_debug 1 \
                2>&1 | tee /tmp/ue.log
        # data-plane checks (ping/iperf) run via kubectl exec into these pods
      {{- if .Values.prometheus.enabled }}
        # Per-subscriber byte counters for the NMS Traffic History tab's
        # subscriber / radio / RAN-type views. The backend resolves IMSIs via
        # open5gs_radio_info and then queries
        # open5gs_subscriber_{up,down}_bytes_total{imsi=~...} — but nothing
        # ever emitted those series (the declared nftables accounting module
        # is not part of this NMS build), so those views were permanently
        # "No data yet". This sidecar publishes them from the one place that
        # unambiguously sees each subscriber's traffic: the UE's own oaitun
        # device (tx = uplink, rx = downlink). The imsi label is parsed from
        # this pod's own UE config so it always matches open5gs_radio_info,
        # whatever the ordinal -> IMSI mapping happens to be. Scoped out of
        # the aggregate charts by the metric_relabel drop lists on the nms and
        # ogstun jobs (see prometheus-configmap.yaml).
        - name: ue-tunnel-metrics
          image: "{{ .Values.images.nmsBackend.repository }}:{{ .Values.images.nmsBackend.tag }}"
          imagePullPolicy: Never
          command: ["node", "-e"]
          args:
            - |
              const http = require('http'), fs = require('fs');
              // IMSI from this pod's own UE conf (mounted here too), not the
              // pod ordinal — the ordinal->IMSI mapping is values data.
              const imsi = (() => {
                try {
                  const ord = process.env.HOSTNAME.split('-').pop();
                  const conf = fs.readFileSync('/config/ue' + ord + '.conf', 'utf8');
                  const m = conf.match(/imsi\s*=\s*"?(\d+)"?/);
                  return m ? m[1] : 'unknown';
                } catch (e) { return 'unknown'; }
              })();
              const snap = () => {
                let up = 0, down = 0;
                let note = '';
                try {
                  // The oaitun device appears only after PDU session setup
                  // (and gets recreated on re-registration) — until then
                  // serve zeros, do not crash.
                  for (const ifc of fs.readdirSync('/sys/class/net')) {
                    if (!ifc.startsWith('oaitun_ue')) continue;
                    up += Number(fs.readFileSync('/sys/class/net/' + ifc + '/statistics/tx_bytes', 'utf8').trim());
                    down += Number(fs.readFileSync('/sys/class/net/' + ifc + '/statistics/rx_bytes', 'utf8').trim());
                  }
                } catch (e) { note = '# read error: ' + e.message + '\n'; }
                return '# HELP open5gs_subscriber_up_bytes_total Cumulative uplink bytes per subscriber IMSI (UE tunnel tx)\n' +
                       '# TYPE open5gs_subscriber_up_bytes_total counter\n' +
                       'open5gs_subscriber_up_bytes_total{imsi="' + imsi + '"} ' + up + '\n' +
                       '# HELP open5gs_subscriber_down_bytes_total Cumulative downlink bytes per subscriber IMSI (UE tunnel rx)\n' +
                       '# TYPE open5gs_subscriber_down_bytes_total counter\n' +
                       'open5gs_subscriber_down_bytes_total{imsi="' + imsi + '"} ' + down + '\n' + note;
              };
              http.createServer((req, res) => {
                res.writeHead(200, {'Content-Type': 'text/plain'});
                res.end(snap());
              }).listen(9106);
          ports:
            - containerPort: 9106
              name: ue-metrics
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: ue-config, mountPath: /config, readOnly: true }
      {{- end }}
      volumes:
        - name: net-tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        - name: ue-config
          configMap: { name: {{ .Release.Name }}-ue-config }
---
{{- /* ConfigMap holds UE configs; keys ue0.conf..ueN.conf match ordinals.
     Real IMSI/keys come from values (values.ue.configs) rendered here. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ue-config
  labels: {{- include "oran-lab.labels" (dict "ctx" . "component" "ue") | nindent 4 }}
data:
{{- range $i, $cfg := .Values.ue.configs }}
  ue{{ $i }}.conf: |
{{ $cfg | indent 4 }}
{{- end }}
{{- end }}
