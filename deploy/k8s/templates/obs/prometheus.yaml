{{- if .Values.prometheus.enabled }}
# Minimal Prometheus for the NMS Traffic History tab (and any later panels).
# Single instance, in-cluster, 24h retention. It scrapes three jobs (see
# prometheus-configmap.yaml): the NMS backend health/metrics endpoint, the
# Open5GS NF metric endpoints on the pod IPs (AMF/SMF/UPF bind 0.0.0.0:9090)
# and the ogstun exporter sidecar in the UPF pod (:9105) which produces the
# open5gs_gtp_* series the tab's PromQL queries.
# Image must be preloaded into the node's containerd store, like every other
# lab image (imagePullPolicy Never).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: {{- include "oran-lab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
---
# Namespace-scoped read access: kubernetes_sd role=pod needs to list pods to
# discover the NF metric endpoints. No cluster-wide permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: {{- include "oran-lab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: {{- include "oran-lab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: {{- include "oran-lab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  labels: {{- include "oran-lab.labels" (dict "ctx" $ "component" "prometheus") | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Roll the pod whenever the scrape config changes — Prometheus only
        # reads its config at startup (no lifecycle reload endpoint wired).
        checksum/config: {{ include (print $.Template.BasePath "/obs/prometheus-configmap.yaml") . | sha256sum }}
      labels: {{- include "oran-lab.labels" (dict "ctx" $ "component" "prometheus") | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: Never
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-prometheus-config
        - name: data
          emptyDir: {}
{{- end }}
