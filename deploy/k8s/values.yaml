obs:
  enabled: true
# Prometheus: on by default (backs the NMS Traffic History tab). Requires the
# prom/prometheus image preloaded into the node's containerd store (it ships in
# the machine image). NOTE: enabling this adds the ogstun-metrics sidecar to
# the UPF pod — on an ALREADY-RUNNING lab that restarts the UPF and drops the
# UE data plane; then run the sequenced recovery (wait for the UPF rollout,
# restart SMF — it caches the UPF pod IP at startup — and force-delete the UE
# pods so they re-attach). On a fresh install nothing to recover.
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.53.0
verify:
  enabled: true
  image:
    # bitnami/kubectl:1.30 was archived out of the main bitnami repo; the
    # frozen 1.30 tag lives in bitnamilegacy. Preloaded on the lab node.
    repository: bitnamilegacy/kubectl
    tag: "1.30"
